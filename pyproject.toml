[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klang-bridge"
version = "1.0.0"
description = "Native standard-library client for the KLang browser bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
klangb = "klang_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["klang_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py312"
line-length = 100
